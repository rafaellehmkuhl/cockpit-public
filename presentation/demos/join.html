<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1416">
<title>Get in the way</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0a1416; --bg2: #0f1f22; --line: rgba(255,255,255,.12); --ink: #e9f2ef; --muted: #8fa7a2;
    --kelp: #4fa483; --kelp-hi: #6cc39f; --amber: #d8a657; --red: #d2686a;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(600px 400px at 50% -10%, rgba(79,164,131,.22), transparent 70%), linear-gradient(170deg, var(--bg2), var(--bg));
    color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }
  .screen {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .kicker { font-size: 12px; letter-spacing: 2.6px; text-transform: uppercase; color: var(--kelp); font-weight: 700; }
  h1 { font-size: 40px; line-height: 1.05; letter-spacing: -1px; font-weight: 720; text-wrap: balance; }
  p { font-size: 17px; line-height: 1.5; color: var(--muted); max-width: 32ch; }
  .go { font: inherit; font-size: 20px; font-weight: 680; color: #07120f; background: var(--kelp); border: 0; border-radius: 999px; padding: 16px 44px; cursor: pointer; }
  .go:active { background: var(--kelp-hi); }
  .small { font-size: 13px; color: #6a827e; max-width: 34ch; }

  #map { position: fixed; inset: 0; background: #0a1416; }
  .bar {
    position: fixed; left: 0; right: 0; z-index: 500; display: flex; justify-content: center; pointer-events: none;
    padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right));
  }
  .bar.top { top: 0; padding-top: max(12px, env(safe-area-inset-top)); }
  .bar.bottom { bottom: 0; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .pill {
    pointer-events: auto; display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 1.35;
    background: rgba(10,20,22,.86); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-align: center; max-width: 100%;
  }
  .pill b { font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: none; }
  .dot.ok { background: var(--kelp); box-shadow: 0 0 0 4px rgba(79,164,131,.25); }
  .toast { background: rgba(210,104,106,.95); color: #fff; border-color: transparent; font-weight: 600; }
  .recenter {
    position: fixed; z-index: 500; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px);
    font: inherit; font-size: 14px; font-weight: 650; color: var(--ink); background: rgba(10,20,22,.86); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 14px; cursor: pointer;
  }
  .boat { width: 34px; height: 34px; display: grid; place-items: center; }
  .boat svg { width: 34px; height: 34px; filter: drop-shadow(0 0 4px rgba(0,0,0,.7)); }

  .flash {
    position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 32px;
    background: var(--kelp); color: #07120f; font-size: 38px; font-weight: 780; text-align: center; line-height: 1.1;
    animation: pulse .5s ease-in-out 4 alternate;
  }
  @keyframes pulse { from { background: var(--kelp); } to { background: #e9f2ef; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
</style>
</head>
<body>
<div class="screen" id="intro">
  <div class="kicker">ArduPilot Dev Conference · Cockpit</div>
  <h1>Get in the boat's way</h1>
  <p>Tap the map to drop an obstacle. The boat on stage has to steer around every one of them.</p>
  <button class="go" id="join">Join</button>
  <p class="small">Only the spots you tap are sent. Nothing about you or your phone.</p>
</div>

<div id="live" hidden>
  <div id="map"></div>
  <div class="bar top"><div class="pill"><span class="dot" id="dot"></span><span><b id="people">1</b> in · <b id="obstacles">0</b> obstacles</span></div></div>
  <button class="recenter" id="recenter">Boat</button>
  <div class="bar bottom"><div class="pill" id="status">Waiting for the boat…</div></div>
</div>

<div class="flash" id="flash" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  'use strict'
  const $ = (id) => document.getElementById(id)
  let ws = null, retry = 500
  let minDistance = 10, left = 5, vehicle = null, follow = true, toastTimer
  let map, boatMarker, boatZone
  const obstacleLayer = []

  const statusText = () =>
    !vehicle ? 'Waiting for the boat…' : left > 0 ? `Tap the map to drop an obstacle · <b>${left}</b> left` : 'All yours are on the map. Watch the boat!'
  const showStatus = () => {
    clearTimeout(toastTimer)
    $('status').classList.remove('toast')
    $('status').innerHTML = statusText()
  }
  const toast = (text) => {
    $('status').textContent = text
    $('status').classList.add('toast')
    navigator.vibrate?.(40)
    clearTimeout(toastTimer)
    toastTimer = setTimeout(showStatus, 2500)
  }

  const distanceM = (a, b) => {
    const rad = Math.PI / 180
    const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2
    return 2 * 6371000 * Math.asin(Math.sqrt(h))
  }

  const boatIcon = (hdg) => L.divIcon({
    className: 'boat', iconSize: [34, 34],
    html: `<svg viewBox="0 0 24 24" style="transform: rotate(${hdg ?? 0}deg)"><path d="M12 2 L19 21 L12 17 L5 21 Z" fill="#4fa483" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  })

  const setVehicle = (v) => {
    if (!v) return
    const first = !vehicle
    vehicle = v
    const at = [v.lat, v.lon]
    if (!boatMarker) {
      boatZone = L.circle(at, { radius: minDistance, color: '#d2686a', weight: 2, dashArray: '4 4', fillOpacity: 0.12, interactive: false }).addTo(map)
      boatMarker = L.marker(at, { icon: boatIcon(v.hdg), interactive: false, zIndexOffset: 1000 }).addTo(map)
    } else {
      boatZone.setLatLng(at)
      boatMarker.setLatLng(at).setIcon(boatIcon(v.hdg))
    }
    if (first) map.setView(at, 18)
    else if (follow) map.panTo(at, { animate: true, duration: 0.25 })
    if (first || !$('status').classList.contains('toast')) showStatus()
  }

  const setObstacles = (list) => {
    obstacleLayer.splice(0).forEach((m) => m.remove())
    for (const o of list) {
      obstacleLayer.push(L.circleMarker([o.lat, o.lon], { radius: 9, color: '#fff', weight: 2, fillColor: '#d2686a', fillOpacity: 1, interactive: false }).addTo(map))
    }
    $('obstacles').textContent = list.length
  }

  const connect = () => {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/crowd`)
    ws.onopen = () => { retry = 500; $('dot').classList.add('ok') }
    ws.onclose = () => { $('dot').classList.remove('ok'); setTimeout(connect, retry); retry = Math.min(retry * 2, 8000) }
    ws.onmessage = (e) => {
      let msg
      try { msg = JSON.parse(e.data) } catch { return }
      if (msg.count) $('people').textContent = msg.count
      if (msg.type === 'hello') { minDistance = msg.minDistance; left = msg.left; setObstacles(msg.obstacles); setVehicle(msg.vehicle); showStatus() }
      if (msg.type === 'vehicle') setVehicle(msg.vehicle)
      if (msg.type === 'obstacles') setObstacles(msg.list)
      if (msg.type === 'placed') { left = msg.left; showStatus() }
      if (msg.type === 'rejected') toast(msg.reason)
      if (msg.type === 'flash') flash(msg.text)
    }
  }

  const flash = (text) => {
    $('flash').textContent = text
    $('flash').hidden = false
    navigator.vibrate?.([120, 60, 120, 60, 240])
    clearTimeout(flash.t)
    flash.t = setTimeout(() => ($('flash').hidden = true), 2600)
  }

  const start = () => {
    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([-27.5935, -48.4525], 17)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: 'Imagery © Esri',
    }).addTo(map)
    // Panning by hand stops the map from following the boat until "Boat" is pressed again.
    map.on('dragstart', () => (follow = false))
    map.on('click', (e) => {
      const spot = { lat: e.latlng.lat, lon: e.latlng.lng }
      if (!vehicle) return toast('Waiting for the boat to report where it is.')
      if (distanceM(vehicle, spot) < minDistance) return toast(`Too close to the boat: keep at least ${minDistance} m away.`)
      if (left <= 0) return toast('All yours are on the map already.')
      ws?.readyState === 1 ? ws.send(JSON.stringify({ poi: spot })) : toast('Reconnecting, try again in a second.')
    })
    $('recenter').addEventListener('click', () => { follow = true; if (vehicle) map.setView([vehicle.lat, vehicle.lon], Math.max(map.getZoom(), 17)) })
  }

  $('join').addEventListener('click', async () => {
    try { await navigator.wakeLock?.request('screen') } catch {}
    $('intro').hidden = true
    $('live').hidden = false
    start()
    connect()
  })
})()
</script>
</body>
</html>
