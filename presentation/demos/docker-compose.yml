# The talk's demo server on the VPS: https://apdc2026.rlehmk.dev, feed at wss://apdc2026.rlehmk.dev. Deployed by deploy.sh.
# The boat is a SITL next to it, reached at wss://apdc2026-sitl.rlehmk.dev/<SITL_PATH>/ws/mavlink.
services:
  apdc-demos:
    image: node:22-alpine
    container_name: apdc-demos
    restart: unless-stopped
    working_dir: /app
    command: node server.mjs
    # CONTROL_KEY lives only in the VPS's .env.
    env_file: .env
    # Read the boat straight from the SITL instead of waiting for Cockpit's action to report it.
    environment:
      SITL_M2R: http://apdc-m2r:8088
    volumes:
      - ./server.mjs:/app/server.mjs:ro
      - ./index.html:/app/index.html:ro
      - ./join.html:/app/join.html:ro
      - ./obstacle-map.js:/app/obstacle-map.js:ro
      - ./vendor:/app/vendor:ro
    networks: [my_vps_services_default]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apdc-demos-https.rule=Host(`apdc2026.rlehmk.dev`)"
      - "traefik.http.routers.apdc-demos-https.entrypoints=websecure"
      - "traefik.http.routers.apdc-demos-https.tls=true"
      - "traefik.http.routers.apdc-demos-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.apdc-demos-service.loadbalancer.server.port=8765"

  apdc-sitl:
    build: ./sitl
    container_name: apdc-sitl
    restart: unless-stopped
    volumes:
      - sitl-data:/data
    networks: [my_vps_services_default]

  # SITL_PATH is a secret path segment kept only in the VPS's .env: whoever has the address can drive the boat, and
  # the room watching the talk must not.
  apdc-m2r:
    build:
      context: ./sitl
      dockerfile: Dockerfile.m2r
    container_name: apdc-m2r
    restart: unless-stopped
    depends_on: [apdc-sitl]
    networks: [my_vps_services_default]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apdc-sitl-https.rule=Host(`apdc2026-sitl.rlehmk.dev`) && PathPrefix(`/${SITL_PATH:?}`)"
      - "traefik.http.routers.apdc-sitl-https.entrypoints=websecure"
      - "traefik.http.routers.apdc-sitl-https.tls=true"
      - "traefik.http.routers.apdc-sitl-https.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.apdc-sitl-https.middlewares=apdc-sitl-strip"
      - "traefik.http.middlewares.apdc-sitl-strip.stripprefix.prefixes=/${SITL_PATH:?}"
      - "traefik.http.services.apdc-sitl-service.loadbalancer.server.port=8088"

volumes:
  sitl-data:

networks:
  my_vps_services_default:
    external: true
