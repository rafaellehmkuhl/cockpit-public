<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gimbal camera feed</title>
<!-- What the demo's gimbal camera sees. A headless browser on the VPS renders this page and streams it over RTSP. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87b7d6; }
  canvas { display: block; width: 100%; height: 100%; }
  .osd { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 600 18px/1.2 ui-monospace, Menlo, monospace;
         text-shadow: 0 1px 3px rgba(0, 0, 0, .8); }
  .osd > * { position: absolute; }
  /* Inset well inside the frame: shown full screen in Cockpit, the video sits under its top and bottom bars, and
     filling a screen narrower than 16:9 crops its sides. */
  .name { top: 9%; left: 6%; }
  .clock { top: 9%; right: 6%; }
  .attitude { bottom: 9%; left: 6%; }
  .rec { top: calc(9% + 28px); left: 6%; color: #ff4b4b; }
  .rec[hidden] { display: none; }
  .cross { left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; opacity: .7;
           background: linear-gradient(#fff, #fff) center / 2px 100% no-repeat, linear-gradient(#fff, #fff) center / 100% 2px no-repeat; }
  .flash { inset: 0; background: #fff; opacity: 0; }
  .flash.go { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
</style>
</head>
<body>
<div class="osd">
  <div class="name">CAM 1 · BOW</div>
  <div class="clock" id="clock"></div>
  <div class="rec" id="rec" hidden>● REC</div>
  <div class="cross"></div>
  <div class="attitude" id="attitude"></div>
  <div class="flash" id="flash"></div>
</div>
<script type="module">
import * as THREE from '/vendor/three/three.module.min.js'

// Same slew and axis conventions as gimbal-view.js, so the feed moves exactly like the 3D gimbal next to it.
const SLEW_DEG_PER_S = 90
// On the VPS the GPU is the CPU, so the streamer picks how often and how sharp to render: `?fps=` and `?scale=`, the
// fraction of the page's size the scene renders at before it is scaled up. The OSD is HTML, so its text stays sharp.
const params = new URLSearchParams(location.search)
const MAX_FPS = Number(params.get('fps')) || 30
const RAD = Math.PI / 180
const shortestDelta = (from, to) => ((((to - from + 180) % 360) + 360) % 360) - 180
const $ = (id) => document.getElementById(id)

const renderer = new THREE.WebGLRenderer({ antialias: false })
renderer.setPixelRatio(Number(params.get('scale')) || 1)
document.body.prepend(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(0x87b7d6)
scene.fog = new THREE.Fog(0x9cc4dc, 120, 900)
scene.add(new THREE.HemisphereLight(0xdff2ff, 0x2a4a3a, 1.4))
const sun = new THREE.DirectionalLight(0xfff3dc, 2.2)
sun.position.set(-200, 300, 400)
scene.add(sun)

// A fixed seed, so every restart of the stream shows the same place.
let seed = 7
const random = () => ((seed = (seed * 16807) % 2147483647) / 2147483647)
const flat = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true })
// Everything that never moves is merged into one mesh per material once the scene is built: on the CPU renderer each
// draw call costs far more than its triangles, and the shore alone is hundreds of objects.
const statics = []
const put = (geometry, material, x, y, z) => {
  const m = new THREE.Mesh(geometry, material)
  m.position.set(x, y, z)
  statics.push(m)
  return m
}
const putMoving = (geometry, material, x, y, z) => {
  const m = new THREE.Mesh(geometry, material)
  m.position.set(x, y, z)
  scene.add(m)
  return m
}
const bakeStatics = () => {
  const byMaterial = new Map()
  for (const m of statics) {
    m.updateMatrix()
    const triangles = m.geometry.toNonIndexed().applyMatrix4(m.matrix).attributes.position.array
    if (!byMaterial.has(m.material)) byMaterial.set(m.material, [])
    byMaterial.get(m.material).push(triangles)
  }
  for (const [material, parts] of byMaterial) {
    const merged = new Float32Array(parts.reduce((n, a) => n + a.length, 0))
    parts.reduce((offset, a) => (merged.set(a, offset), offset + a.length), 0)
    const geometry = new THREE.BufferGeometry()
    geometry.setAttribute('position', new THREE.BufferAttribute(merged, 3))
    geometry.computeVertexNormals()
    scene.add(new THREE.Mesh(geometry, material))
  }
}

// Water, with a few hundred vertices rocking so the picture is never still.
// Close to the boat the grid is fine, so looking down still shows facets moving; far away it is coarse.
const water = new THREE.PlaneGeometry(3000, 3000, 60, 60)
water.rotateX(-Math.PI / 2)
{
  const p = water.attributes.position.array
  for (let i = 0; i < p.length; i += 3) {
    const squeeze = (v) => Math.sign(v) * 1500 * (Math.abs(v) / 1500) ** 2.2
    p[i] = squeeze(p[i])
    p[i + 2] = squeeze(p[i + 2])
  }
  const shade = new THREE.Color()
  const colors = []
  for (let i = 0; i < p.length; i += 3) {
    shade.setHex(0x2d6f86).offsetHSL(0, 0, (random() - 0.5) * 0.06)
    colors.push(shade.r, shade.g, shade.b)
  }
  water.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
}
const waterBase = water.attributes.position.array.slice()
putMoving(water, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), 0, 0, 0)

// The shore: a ring of low hills with beaches, trees and houses, open towards the lighthouse ahead.
const hill = flat(0x4f7d3c)
const sand = flat(0xd9c48f)
const trunk = flat(0x6b4a2b)
const leaves = [flat(0x2f6b34), flat(0x3d7d3a), flat(0x285a2e)]
for (let i = 0; i < 46; i++) {
  const a = (i / 46) * Math.PI * 2 + random() * 0.08
  const r = 260 + random() * 90
  const x = Math.sin(a) * r
  const z = Math.cos(a) * r
  if (Math.abs(shortestDelta(0, a / RAD)) < 22) continue
  const h = 25 + random() * 55
  put(new THREE.ConeGeometry(45 + random() * 30, h, 7), hill, x, h / 2 - 2, z)
  put(new THREE.CylinderGeometry(70, 80, 2, 9), sand, x * 0.86, 0.6, z * 0.86)
  for (let t = 0; t < 5; t++) {
    const tx = x * (0.82 + random() * 0.08) + (random() - 0.5) * 50
    const tz = z * (0.82 + random() * 0.08) + (random() - 0.5) * 50
    const s = 0.8 + random() * 0.8
    put(new THREE.CylinderGeometry(0.6 * s, 0.8 * s, 5 * s, 6), trunk, tx, 3 * s, tz)
    put(new THREE.ConeGeometry(4 * s, 12 * s, 7), leaves[t % 3], tx, 11 * s, tz)
  }
}
// Houses on the right-hand shore, which is where yaw +90 looks.
const walls = [flat(0xf1ede4), flat(0xe7c99a), flat(0xb9d3e3)]
const roof = flat(0xa4483a)
for (let i = 0; i < 9; i++) {
  const x = -190 - random() * 30
  const z = -60 + i * 22
  put(new THREE.BoxGeometry(12, 8, 14), walls[i % 3], x, 5, z)
  const top = put(new THREE.ConeGeometry(10.5, 6, 4), roof, x, 12, z)
  top.rotation.y = Math.PI / 4
}
// A pier reaching out from the houses, with posts.
const wood = flat(0x8a6a48)
put(new THREE.BoxGeometry(70, 1, 5), wood, -150, 2, 20)
for (let i = 0; i < 8; i++) put(new THREE.CylinderGeometry(0.5, 0.5, 5, 6), wood, -118 - i * 9, 0.5, 22.5)

// The lighthouse straight ahead, the landmark the camera starts on.
const white = flat(0xf4f4f0)
const red = flat(0xc8352e)
put(new THREE.CylinderGeometry(40, 46, 6, 10), flat(0x6f6a60), 0, 1, 330)
for (let i = 0; i < 6; i++) {
  const r = 7 - i * 0.6
  put(new THREE.CylinderGeometry(r - 0.3, r, 7, 16), i % 2 ? red : white, 0, 7 + i * 7, 330)
}
put(new THREE.CylinderGeometry(3.5, 3.5, 4, 12), flat(0xfff2a8), 0, 51, 330)
put(new THREE.ConeGeometry(4.5, 5, 12), red, 0, 55.5, 330)

// A sailboat off to the left and an island with palms behind it.
const sail = put(new THREE.ConeGeometry(6, 18, 3), white, 120, 11, 160)
sail.scale.set(0.15, 1, 1)
put(new THREE.BoxGeometry(5, 2, 14), flat(0x30485c), 120, 1, 160)
put(new THREE.SphereGeometry(30, 9, 6, 0, Math.PI * 2, 0, Math.PI / 2), hill, 190, -2, 230)

// Buoys close to the boat, which bob, so even looking down there is something moving.
const buoys = []
for (const [x, z, color] of [[6, 18, red], [-9, 14, flat(0x2f8f4f)], [-14, 6, red], [10, 32, flat(0x2f8f4f)], [-4, 45, red], [18, 9, flat(0xf0b400)], [-5, 0.6, flat(0xf0b400)]]) {
  buoys.push(putMoving(new THREE.ConeGeometry(0.9, 2.4, 10), color, x, 1, z))
}
// Clouds: flattened clusters, far and high.
const cloud = new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x8a9aa8, flatShading: true })
for (let i = 0; i < 14; i++) {
  const a = random() * Math.PI * 2
  const r = 400 + random() * 300
  const c = put(new THREE.IcosahedronGeometry(30 + random() * 25, 0), cloud, Math.sin(a) * r, 140 + random() * 90, Math.cos(a) * r)
  c.scale.set(2.4, 0.5, 1.2)
}

bakeStatics()

// The gimbal on the boat's bow, nested yaw → roll → pitch like gimbal-view.js.
const yaw = new THREE.Group()
yaw.position.set(0, 2.2, 0.6)
scene.add(yaw)
const roll = new THREE.Group()
yaw.add(roll)
const pitch = new THREE.Group()
roll.add(pitch)
// A three.js camera looks down -z; the gimbal's lens faces +z.
const lens = new THREE.PerspectiveCamera(62, 16 / 9, 0.3, 2000)
lens.rotation.y = Math.PI
pitch.add(lens)

const resize = () => {
  renderer.setSize(innerWidth, innerHeight, false)
  lens.aspect = innerWidth / innerHeight
  lens.updateProjectionMatrix()
}
addEventListener('resize', resize)
resize()

// The camera state comes from the demo server, the same place the console and Cockpit's widget read it from.
const current = { roll: 0, pitch: 0, yaw: 0 }
const target = { roll: 0, pitch: 0, yaw: 0 }
let photos = null
const onCamera = (c) => {
  Object.assign(target, { roll: c.roll, pitch: c.pitch, yaw: c.yaw })
  $('rec').hidden = !c.recording
  if (photos !== null && c.photos > photos) {
    $('flash').classList.remove('go')
    void $('flash').offsetWidth
    $('flash').classList.add('go')
  }
  photos = c.photos
}
const events = new EventSource('/events')
events.addEventListener('state', (e) => onCamera(JSON.parse(e.data).camera))
events.addEventListener('camera', (e) => onCamera(JSON.parse(e.data)))

let last = performance.now()
const frame = (now) => {
  requestAnimationFrame(frame)
  if (now - last < 1000 / MAX_FPS - 2) return
  const dt = Math.min(Math.max(now - last, 0), 100)
  last = now
  const step = (SLEW_DEG_PER_S * dt) / 1000
  for (const axis of ['roll', 'pitch', 'yaw']) {
    const delta = axis === 'yaw' ? shortestDelta(current[axis], target[axis]) : target[axis] - current[axis]
    if (Math.abs(delta) < 0.01) continue
    current[axis] += Math.sign(delta) * Math.min(Math.abs(delta), step)
    if (axis === 'yaw') current.yaw = shortestDelta(0, current.yaw)
  }
  yaw.rotation.y = -current.yaw * RAD
  roll.rotation.z = current.roll * RAD
  pitch.rotation.x = -current.pitch * RAD

  const t = now / 1000
  const p = water.attributes.position.array
  for (let i = 0; i < p.length; i += 3) p[i + 1] = waterBase[i + 1] + Math.sin(p[i] * 0.05 + t * 1.3) * 0.25 + Math.cos(p[i + 2] * 0.04 + t) * 0.25
  // Flat shading takes each face's normal from its position, so the normals need no update.
  water.attributes.position.needsUpdate = true
  buoys.forEach((b, i) => {
    b.position.y = 1 + Math.sin(t * 1.6 + i) * 0.25
    b.rotation.z = Math.sin(t * 1.1 + i * 2) * 0.12
  })

  $('clock').textContent = new Date().toLocaleTimeString('en-GB')
  $('attitude').textContent = `R ${current.roll.toFixed(1)}°  P ${current.pitch.toFixed(1)}°  Y ${current.yaw.toFixed(1)}°`
  renderer.render(scene, lens)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
